name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Pytest
        run: pytest -q

      - name: CLI smoke (quick train)
        run: |
          resume-train --data ResumeDataSet.csv --out /tmp/resume_bundle.joblib --quick --max-rows 350
          resume-predict --model /tmp/resume_bundle.joblib --text "Python machine learning pandas scikit-learn"
